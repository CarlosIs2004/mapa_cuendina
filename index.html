<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa Cuendina</title>
</head>
<body class="bg-slate-100 text-slate-800">
  <!-- Static layout; behavior is attached by src/main.ts (composition root). -->
  <div class="relative h-full w-full overflow-hidden">
    <aside id="sidebar"
      class="absolute z-[1000] top-0 left-0 h-full w-80 max-w-[85%] bg-white shadow-xl flex flex-col transition-transform duration-300">
      <header class="p-4 border-b">
        <h1 class="text-lg font-bold">Cuendina · Amaguaña</h1>
        <p class="text-xs text-slate-500">Mapa comunitario de seguridad</p>
        <button id="addBtn" class="mt-3 w-full rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2">
          ＋ Agregar punto
        </button>
        <div id="pointsTransfer">
          <div class="mt-2 flex gap-2">
            <button id="exportPointsBtn" type="button" class="flex-1 rounded-lg border text-xs font-semibold py-2 hover:bg-slate-50">Exportar puntos (JSON)</button>
            <button id="importPointsBtn" type="button" class="flex-1 rounded-lg border text-xs font-semibold py-2 hover:bg-slate-50">Importar puntos (JSON)</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" class="hidden" />
          <p id="transferMsg" role="status" aria-live="polite" class="hidden mt-1 text-xs text-slate-600"></p>
        </div>
        <div id="exportPanel" class="mt-2 flex gap-2">
          <select id="exportFmt" class="flex-1 min-w-0 rounded-lg border px-2 py-2 text-sm">
            <option value="a3">PDF A3 (1 hoja)</option>
            <option value="a4x4">PDF A4 (4 hojas para unir)</option>
            <option value="a4">PDF A4 (1 hoja)</option>
            <option value="png">Imagen PNG</option>
          </select>
          <button id="exportBtn" class="rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-3">Descargar</button>
        </div>
        <input id="search" type="search" placeholder="Buscar…"
          class="mt-3 w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        <div id="filters" class="mt-3 space-y-2"></div>
      </header>
      <ul id="list" class="flex-1 overflow-y-auto divide-y"></ul>
    </aside>

    <button id="toggle" aria-label="Alternar panel"
      class="absolute z-[1001] top-3 left-3 bg-white rounded-lg shadow-lg px-3 py-2 text-sm font-medium transition-transform duration-300">☰</button>

    <div id="hint" class="hidden absolute z-[1001] top-3 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm rounded-lg px-4 py-2 shadow-lg">
      Tocá el mapa donde querés el punto · <button id="cancelAdd" class="underline">cancelar</button>
    </div>

    <div id="map" class="h-full w-full"></div>

    <!-- Form modal -->
    <div id="modal" class="hidden absolute inset-0 z-[2000] bg-black/40 flex items-center justify-center p-4">
      <form id="form" class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-3">
        <h2 class="font-bold">Nuevo punto</h2>
        <label class="block text-sm">Tipo
          <select id="fType" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm"></select>
        </label>
        <label class="block text-sm">Nombre
          <input id="fName" required maxlength="80" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
        </label>
        <label class="block text-sm">Descripción (opcional)
          <textarea id="fDesc" rows="3" maxlength="300" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm"></textarea>
        </label>
        <div class="flex gap-2 justify-end">
          <button type="button" id="fCancel" class="rounded-lg border px-4 py-2 text-sm">Cancelar</button>
          <button type="submit" class="rounded-lg bg-emerald-600 text-white px-4 py-2 text-sm font-semibold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
